<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Aliff Coway</title><link rel="stylesheet" href="/style.css">
<style>
.admin{max-width:1200px;margin:auto;padding:35px 18px}.admin-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:22px}.admin form{box-shadow:none;border:0;padding:0}.admin textarea{min-height:160px}.tabs-admin{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.tabs-admin button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:700}.tabs-admin button.active{background:#111;color:#fff;border-color:#111}.admin-section{display:none}.admin-section.active{display:block}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px;border:1px solid #eee;border-radius:14px;align-items:center}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#f2f2f2}.row-left{display:flex;align-items:center;gap:12px;min-width:0}.row-left>div:last-child{min-width:0}.row-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px;flex-shrink:0}.danger{background:#fee;color:#a00;padding:9px 12px;border-radius:999px}.muted{color:#777;font-size:12px}.hidden{display:none}.login-box{max-width:430px;margin:80px auto}.status{font-size:12px;margin:10px 0}.success{color:#087b38}.error{color:#b00020}.image-preview{width:100%;max-height:260px;object-fit:contain;border:1px dashed #ddd;border-radius:14px;background:#fafafa;margin:8px 0}.file-label{display:flex;flex-direction:column;gap:6px}.admin-actions-top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.danger-text{color:#b00020}.two-admin{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.two-admin{grid-template-columns:1fr}.row{align-items:flex-start}.actions{flex-direction:column}.admin{padding:25px 12px}}
</style></head>
<body>
<header class="header"><a class="brand" href="/"><span class="brand-mark">C</span><span data-site-name>ALIFF <b>COWAY</b></span></a><span style="margin-left:auto;font-size:12px;color:#777">Admin CMS</span></header>
<main class="admin">
<section id="login" class="panel login-box"><span class="eyebrow">PRIVATE ADMIN</span><h1>Admin Login</h1><p class="muted">Manage your website, products and blog from here.</p><form id="loginForm"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary" type="submit">Login</button><div id="loginMsg" class="status"></div></form></section>
<section id="dashboard" class="hidden">
<div class="admin-actions-top"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>Aliff Coway CMS</h1></div><button id="logout" class="btn secondary">Logout</button></div>
<div class="tabs-admin"><button data-tab="settings" class="active">⚙️ Website</button><button data-tab="products">🛒 Products</button><button data-tab="blog">✍️ Blog</button></div>

<section id="tab-settings" class="admin-section active"><div class="panel"><h2>Website Settings</h2><p class="muted">Change these once and the public website updates automatically.</p><form id="settingsForm"><label>Website / Sales Name<input name="name" required placeholder="ALIFF COWAY"></label><label>WhatsApp Number<input name="whatsapp" required inputmode="numeric" placeholder="60123456789"><small class="muted">Malaysia format: 60123456789 — no +, spaces or dashes.</small></label><label>Email<input name="email" type="email" placeholder="your@email.com"></label><label>Tagline<input name="tagline" placeholder="Promosi dan khidmat jualan Coway."></label><button class="btn primary" type="submit">Save Website Settings</button><div id="settingsMsg" class="status"></div></form></div></section>

<section id="tab-products" class="admin-section"><div class="admin-grid"><div class="panel"><h2 id="productEditorTitle">Add Product</h2><form id="productForm"><input type="hidden" name="id"><label>Product Name<input name="name" required placeholder="NEON"></label><div class="two-admin"><label>Product Code<input name="code" placeholder="CHP-6210N"></label><label>Category<select name="cat"><option value="water">Penapis Air</option><option value="air">Penapis Udara</option><option value="home">Rumah</option></select></label></div><label>Product Type<input name="type" placeholder="Penapis Air"></label><div class="two-admin"><label>Monthly Price<input name="price" placeholder="RM59"></label><label>Old Price<input name="old" placeholder="RM106.92"></label></div><label class="file-label">Product Picture<input id="productImage" type="file" accept="image/jpeg,image/png,image/webp"></label><input type="hidden" name="image"><img id="productPreview" class="image-preview hidden" alt="Product preview"><button class="btn primary" type="submit">Save Product</button><button class="btn secondary" id="clearProduct" type="button">Clear</button><div id="productMsg" class="status"></div></form></div><div class="panel"><h2>Products</h2><div id="productsList" class="list"></div></div></div></section>

<section id="tab-blog" class="admin-section"><div class="admin-grid"><div class="panel"><h2 id="articleEditorTitle">New Article</h2><form id="articleForm"><input type="hidden" name="id"><label>Title<input name="title" required></label><label>Slug<input name="slug" placeholder="contoh-tips-penapis-air"></label><label>Excerpt<input name="excerpt"></label><div class="two-admin"><label>SEO Title<input name="seoTitle"></label><label>Keywords<input name="keywords" placeholder="penapis air, Coway"></label></div><label>SEO Description<textarea name="seoDescription" rows="3"></textarea></label><label class="file-label">Blog Cover Image<input id="coverImageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><input type="hidden" name="coverImage"><img id="coverPreview" class="image-preview hidden" alt="Cover preview"><label>Article Content<textarea name="content" required placeholder="Tulis artikel di sini..."></textarea></label><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="published" checked style="width:auto"> Published</label><button class="btn primary" type="submit">Save Article</button><button class="btn secondary" id="clearArticle" type="button">Clear</button><div id="articleMsg" class="status"></div></form></div><div class="panel"><h2>Articles</h2><div id="articlesList" class="list"></div></div></div></section>
</section></main>
<script>
let editingProductId=null,editingArticleId=null;
const $=s=>document.querySelector(s);
async function api(url,opts={}){const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function boot(){try{const s=await api('/auth');if(s.loggedIn)showDash();}catch(e){}}
function showDash(){$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');loadSettings();loadProducts();loadArticles();}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});showDash();}catch(err){showMsg('#loginMsg',err.message,true)}};
$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};
function showMsg(sel,msg,error=false){const el=$(sel);el.textContent=msg;el.className='status '+(error?'error':'success');}
document.querySelectorAll('.tabs-admin button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs-admin button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.admin-section').forEach(x=>x.classList.remove('active'));$('#tab-'+b.dataset.tab).classList.add('active')});
async function loadSettings(){const s=await api('/admin/settings');const f=$('#settingsForm');f.name.value=s.name||'';f.whatsapp.value=s.whatsapp||'';f.email.value=s.email||'';f.tagline.value=s.tagline||'';document.querySelectorAll('[data-site-name]').forEach(el=>el.innerHTML=(s.name||'ALIFF COWAY').replace(/\b(COWAY)\b/i,'<b>$1</b>'));}
$('#settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('/admin/settings',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});showMsg('#settingsMsg','Website settings saved.')}catch(err){showMsg('#settingsMsg',err.message,true)}};
function fileToData(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}
async function uploadImage(file){if(!file)return '';let data=await fileToData(file);if(data.length>2400000){data=await resizeDataUrl(data,1600,0.78)};return (await api('/admin/media',{method:'POST',body:JSON.stringify({data,contentType:file.type})})).url;}
function resizeDataUrl(data,maxW,quality){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,maxW/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};im.src=data})}
function setPreview(img,url){if(url){img.src=url;img.classList.remove('hidden')}else{img.removeAttribute('src');img.classList.add('hidden')}}
async function loadProducts(){const items=await api('/admin/products');window.products=items;$('#productsList').innerHTML=items.map(p=>`<div class="row"><div class="row-left">${p.image?`<img class="thumb" src="${p.image}" alt="">`:'<div class="thumb"></div>'}<div><div class="row-title">${esc(p.name)}</div><div class="muted">${esc(p.type)} · ${esc(p.price)} · ${esc(p.code)}</div></div></div><div class="actions"><button class="btn secondary" onclick="editProduct('${p.id}')">Edit</button><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No products.</p>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.editProduct=id=>{const p=window.products.find(x=>x.id===id);if(!p)return;editingProductId=id;const f=$('#productForm');for(const k of ['name','code','cat','type','price','old','image'])f.elements[k].value=p[k]||'';setPreview($('#productPreview'),p.image);$('#productEditorTitle').textContent='Edit Product';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;await api('/admin/products/'+id,{method:'DELETE'});clearProduct();loadProducts()};
$('#productImage').onchange=async e=>{const file=e.target.files[0];if(file){try{const url=await uploadImage(file);$('#productForm').image.value=url;setPreview($('#productPreview'),url);showMsg('#productMsg','Image uploaded. Save the product to apply it.')}catch(err){showMsg('#productMsg',err.message,true)}}};
$('#productForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const data=Object.fromEntries(f);delete data.id;await api(editingProductId?'/admin/products/'+editingProductId:'/admin/products',{method:editingProductId?'PUT':'POST',body:JSON.stringify(data)});showMsg('#productMsg','Product saved.');clearProduct();loadProducts()}catch(err){showMsg('#productMsg',err.message,true)}};
function clearProduct(){editingProductId=null;$('#productForm').reset();$('#productForm').image.value='';setPreview($('#productPreview'),'');$('#productEditorTitle').textContent='Add Product'}$('#clearProduct').onclick=clearProduct;
async function loadArticles(){const items=await api('/admin/articles');window.articles=items;$('#articlesList').innerHTML=items.map(a=>`<div class="row"><div><div class="row-title">${esc(a.title)}</div><div class="muted">/${esc(a.slug)} · ${a.published?'Published':'Draft'}</div></div><div class="actions"><button class="btn secondary" onclick="editArticle('${a.id}')">Edit</button><button class="danger" onclick="deleteArticle('${a.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No articles yet.</p>'}
window.editArticle=id=>{const a=window.articles.find(x=>x.id===id);if(!a)return;editingArticleId=id;const f=$('#articleForm');for(const k of ['title','slug','excerpt','seoTitle','seoDescription','keywords','coverImage','content'])f.elements[k].value=a[k]||'';f.published.checked=!!a.published;setPreview($('#coverPreview'),a.coverImage);$('#articleEditorTitle').textContent='Edit Article';document.querySelector('[data-tab="blog"]').click();window.scrollTo({top:0,behavior:'smooth'})};
window.deleteArticle=async id=>{if(!confirm('Delete this article?'))return;await api('/admin/articles/'+id,{method:'DELETE'});clearArticle();loadArticles()};
$('#coverImageFile').onchange=async e=>{const file=e.target.files[0];if(file){try{const url=await uploadImage(file);$('#articleForm').coverImage.value=url;setPreview($('#coverPreview'),url);showMsg('#articleMsg','Cover uploaded. Save the article to apply it.')}catch(err){showMsg('#articleMsg',err.message,true)}}};
$('#articleForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const data=Object.fromEntries(f);data.published=f.has('published');delete data.id;await api(editingArticleId?'/admin/articles/'+editingArticleId:'/admin/articles',{method:editingArticleId?'PUT':'POST',body:JSON.stringify(data)});showMsg('#articleMsg','Article saved.');clearArticle();loadArticles()}catch(err){showMsg('#articleMsg',err.message,true)}};
function clearArticle(){editingArticleId=null;$('#articleForm').reset();setPreview($('#coverPreview'),'');$('#articleEditorTitle').textContent='New Article'}$('#clearArticle').onclick=clearArticle;
boot();
</script></body></html>
